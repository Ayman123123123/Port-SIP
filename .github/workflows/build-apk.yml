name: Build APK

# Builds a debug APK on a GitHub-hosted runner, which has access to the
# Android toolchain repositories (dl.google.com, services.gradle.org,
# repo1.maven.org) that are blocked in the dev sandbox.
#
# The APK is uploaded as a build artifact you can download from the
# "Actions" tab of the repository.

on:
  push:
    branches: [ arena/01a064bf-port-sip, main ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Variant to build'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle will be installed and used directly. The repo ships a full
      # Gradle wrapper (gradlew + gradle-wrapper.jar), so we could also rely on
      # ./gradlew, but the setup-gradle action pre-caches the distribution.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # The Android SDK is pre-installed on ubuntu-latest, but only some
      # platforms/build-tools are present by default. Accept licenses so AGP can
      # auto-install the target platform (android-34) if missing.
      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Build APK (${{ github.event.inputs.build_variant || 'debug' }})
        run: |
          V="${{ github.event.inputs.build_variant || 'debug' }}"
          gradle --no-daemon assemble"$(echo "$V" | sed 's/./\U&/')"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: port-sip-${{ github.event.inputs.build_variant || 'debug' }}-apk
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
